    x-apievangelist-gaps:
    - id: no-request-idempotency
      note: >-
        No Idempotency-Key header or parameter on any of the 13 write operations. A retried POST
        can duplicate the record; agents cannot safely retry a Nooks write on timeout.
    - id: no-deprecation-policy
      note: No published deprecation/sunset policy and no RFC 8594 Sunset header support.
    - id: no-changelog
      note: developer.nooks.in/changelog and www.nooks.ai/changelog both 404.
    - id: no-client-sdk
      note: No client library published in any registry; the portal offers generated snippets only.
    - id: proprietary-error-envelope
      note: >-
        Errors are {error:{code,message},traceId} as application/json rather than RFC 9457
        application/problem+json.
    - id: scope-surface-divergence
      note: >-
        The authorization server grants 24 scopes; only 17 map to a published REST operation.
        coaching:read, teams:read, desktop-notes:read, opportunities:read, search:read,
        calls:write and emails:write reach capability the REST contract does not describe.
- target: $.info
  update:
    x-apievangelist-auth-note: >-
      The single BearerAuth http/bearer scheme carries two different credential types — a
      long-lived workspace API key prefixed `nooks-api-` and a 1-hour user-scoped OAuth 2.0 JWT
      from https://oauth.nooks.in. The OAuth flow is fully documented in info.description and in
      RFC 8414 metadata but is NOT modelled as an `oauth2` securityScheme, so mechanical scope
      derivation over this spec returns nothing.
