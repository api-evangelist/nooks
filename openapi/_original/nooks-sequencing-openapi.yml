          required: false
          schema:
            type: array
            items:
              type: string
              enum: [owner, prospect, sequence, sequenceState, sequenceStep]
            maxItems: 3
          style: form
          explode: false
          example: [owner, prospect]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
