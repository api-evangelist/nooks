        This endpoint is idempotent: returns 204 even if the sequence state is already finished.

        Example:
        ```bash
        curl -X POST 'https://partner-api.nooks.in/v1/sequenceStates/880e8400-e29b-41d4-a716-446655440003/actions/finish' \
