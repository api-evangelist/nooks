                      _href: "/v1/accounts/990e8400-e29b-41d4-a716-446655440099"
                    sequenceStep:
                      id: "aa0e8400-e29b-41d4-a716-446655440030"
                      _href: "/v1/sequenceSteps/aa0e8400-e29b-41d4-a716-446655440030"
                    creator:
