finding: >-
  Nooks ships NO client SDK for the Nooks Sequencing API in any language. Searched npm (full-text
  and the @nooks-ai scope), PyPI (nooks, nooks-api, nooks-sdk — all 404), the GitHub org
  github.com/NooksApp, and the Scalar developer portal, which offers generated fetch/curl snippets
  but links no library. The three first-party npm packages below are internal Node infrastructure
  Nooks publishes for its own services — a logger, a metrics collector, and a fork of a ZoomInfo
  auth client — none of which call the Nooks API. Because no official client library exists, NO
  `SDKs` pointer is wired in apis.yml: emitting one would credit Nooks with an SDK surface it does
  not ship. An integrator writes raw HTTP against https://partner-api.nooks.in/v1.
