apis:
- aid: nooks-sequencing-api
  name: Nooks Sequencing API
  description: >-
    The Nooks Sequencing API (also published as the "Nooks External API") provides programmatic
    access to sequences, sequence steps, sequence states (enrollments), prospects, accounts, notes,
    tasks, calls, call dispositions, emails, email templates, mailboxes, and users created in the
    Nooks Sales Engagement Platform. It is an OpenAPI 3.1.0 contract with 37 operations across 30
    paths, cursor pagination (`page[size]`, `page[after]`/`page[before]`), inline expansion via
    `include`, per-endpoint per-minute rate limits with `X-RateLimit-*` headers, and a signed
    `call.logged` webhook.
  humanURL: https://developer.nooks.in/
  baseURL: https://partner-api.nooks.in/v1
