  name: Nooks MCP Server
  description: >-
    Nooks operates a hosted, remote Model Context Protocol server at https://mcp.nooks.in/. It is OAuth-protected
    — an anonymous `tools/list` returns HTTP 401 `invalid_token` — and publishes RFC 9728 protected-resource
    metadata naming https://oauth.nooks.in as its authorization server and the same 24 scopes as the REST
    API.
  humanURL: https://developer.nooks.in/
  baseURL: https://mcp.nooks.in/
