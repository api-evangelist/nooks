aid: nooks
name: Nooks
description: >-
  Nooks is an AI-native sales engagement platform positioned as "The Agent Workspace for
  Intelligent Outbound," where sales representatives and AI agents collaborate on prospecting,
  sequencing, and dialing inside a single workspace. Its products include an AI Parallel Dialer,
  AI Sequencing, AI Coaching, and Signals Intelligence, aimed at helping revenue and SDR teams
  build more pipeline with less manual work. Nooks is backed by Kleiner Perkins, runs its
  application at app.nooks.in, and maintains a SafeBase trust center with SOC 2 Type 2, SOC 3,
  ISO/IEC 27001:2022, GDPR, CCPA, and EU-US DPF coverage plus a Bugcrowd responsible-disclosure
  program. As of this enrichment pass Nooks does not publish a public developer API, SDKs, or
  API reference; it integrates with CRMs and sales tools (Salesforce, HubSpot, and others) rather
  than a self-service API surface.
