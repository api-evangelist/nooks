finding: >-
  29% of the scopes Nooks' authorization server grants (7 of 24) have no operation in the
  published REST contract. The MCP server and the REST API sit behind one authorization server
  and one scope list, so those seven scopes are capability the agent surface can reach and the
  documented API cannot — coaching, search, opportunities, teams, desktop notes, and write access
  to calls and emails. That gap is the crosswalk's actual finding.
