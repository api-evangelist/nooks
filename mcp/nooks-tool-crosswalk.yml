note: >-
  Nooks ships BOTH an OpenAPI REST contract and a hosted MCP server, so the crosswalk is emitted.
  But the MCP `tools/list` is OAuth-gated (401 anonymously) and no tool catalog is published
  anywhere, so there are NO tool names to bind. This crosswalk is therefore built on the one
  public artifact both surfaces share: the 24-scope OAuth authorization grid. Scopes are the
  honest proxy for reach — the REST spec and the MCP server are protected by the SAME
  authorization server and the SAME scope list, so a scope with no REST operation is a
  capability MCP can reach and REST cannot. Every row below is scope-to-operation, not
  tool-to-operation, and is labelled as such. No tool names are invented.
