crm_boundary:
  note: >-
    Prospect, User and Note carry CRM identifiers (crmId, externalId, integrationType) — the data
    model is explicitly a projection over Salesforce/HubSpot records, and CRM-backed writes can
    fail with NO_CRM_CONNECTION (400) or 422 when the CRM record is not writable.
  crm_types: SyncableCrmType, CrmNoteIntegrationType
