note: >-
  Nooks publishes its full rate-limit table, the response headers, and the exhaustion behaviour
  inside the OpenAPI `info.description`, and wires a shared `RateLimitExceeded` 429 response
  component into every operation. Captured verbatim from the spec — no observed live values.
scope: per-workspace and per-endpoint
window: 60s fixed window
window_note: >-
  Separate endpoint buckets do not share quota. Routes without an explicit limit fall into a
  shared default bucket.
headers:
  present_on: every response
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
  reset_units: seconds until the current window resets
  retry_after: Retry-After
  retry_after_units: seconds
  standard: X-RateLimit-* (non-RFC 9331 draft naming)
exhaustion:
  status: 429
  status_text: Too Many Requests
  body: JSON error envelope (see errors/nooks-problem-types.yml)
  example_message: Rate limit exceeded
  retry_signal: Retry-After header
  upstream_note: >-
    A 429 may reflect either the per-workspace Nooks limit or an upstream CRM (Salesforce /
    HubSpot) rate limit hit while servicing the request.
limit_count: 8
